name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps (pdfjs-dist; lockfile committed)
        run: npm ci --no-audit --no-fund
      - name: Syntax-check sources
        run: |
          set -e
          git ls-files '*.mjs' 'bin/*.mjs' | while read -r f; do node --check "$f"; done
          node -e "import('./src/serve.mjs').then(()=>console.log('serve module loads OK'))"
      - name: Tests (zero deps; converter tests skip when tools absent)
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same Dockerfile the VPS deploy runs)
        run: docker build -t drawin:ci .
      - name: Full suite inside the image (real Inkscape + poppler; pdfjs installed for the test run)
        # root: the runtime image's /app dir is root-owned (contents are node-owned);
        # npm ci needs to create node_modules there. Runtime (USER node) is unaffected.
        run: docker run --rm --user root drawin:ci sh -c "npm ci --no-audit --no-fund && npm test"
      - name: Server smoke boot
        run: |
          set -e
          # HOST=0.0.0.0: the published port reaches the container on its
          # external interface; the bare-metal 127.0.0.1 default (#2) would
          # bind loopback inside the container and never accept the mapping.
          cid=$(docker run -d -p 8123:8123 -e HOST=0.0.0.0 drawin:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/ >/dev/null 2>&1; then echo "server healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; docker logs "$cid"; exit 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/drawin
            git pull --ff-only
            docker compose up -d --build
            # Self-heal volume ownership: templates written by older containers
            # that ran as root are root-owned; the USER node app then gets
            # EACCES reading/writing them (e.g. base.clean.svg on /bind).
            docker exec -u root "$(docker compose ps -q app)" chown -R node:node /app/templates /app/preview
            docker image prune -f
